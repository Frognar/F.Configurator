name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore F.Configurator.slnx
      - run: dotnet build F.Configurator.slnx --no-restore
      - run: dotnet test F.Configurator.slnx --no-build
